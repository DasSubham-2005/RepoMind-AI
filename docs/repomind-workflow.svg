<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250">
<rect width="100%" height="100%" fill="#050b1d"/>
<text x="500" y="60" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="32" font-weight="bold">RepoMind AI — RAG Workflow</text>
<text x="500" y="92" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="16">Retrieve first → Generate second</text>
<rect x="200" y="135" width="600" height="110" rx="18" fill="#0c1b39" stroke="#2b7fff" stroke-width="2"/>
<text x="500" y="182" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="22" font-weight="bold">1. Upload Repository</text>
<text x="500" y="213" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="15">ZIP • Code Files • PDF • Documentation</text>
<line x1="500" y1="245" x2="500" y2="285" stroke="#5fdcff" stroke-width="4"/><polygon points="493,280 507,280 500,290" fill="#5fdcff"/>
<rect x="200" y="285" width="600" height="110" rx="18" fill="#0c1b39" stroke="#24549a" stroke-width="2"/>
<text x="500" y="332" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="22" font-weight="bold">2. Extract & Normalize</text>
<text x="500" y="363" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="15">Read supported files and clean text</text>
<line x1="500" y1="395" x2="500" y2="435" stroke="#5fdcff" stroke-width="4"/><polygon points="493,430 507,430 500,440" fill="#5fdcff"/>
<rect x="200" y="435" width="600" height="110" rx="18" fill="#0c1b39" stroke="#24549a" stroke-width="2"/>
<text x="500" y="482" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="22" font-weight="bold">3. Chunk Documents</text>
<text x="500" y="513" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="15">Split large content into overlapping chunks</text>
<line x1="500" y1="545" x2="500" y2="585" stroke="#5fdcff" stroke-width="4"/><polygon points="493,580 507,580 500,590" fill="#5fdcff"/>
<rect x="200" y="585" width="600" height="110" rx="18" fill="#0c1b39" stroke="#24549a" stroke-width="2"/>
<text x="500" y="632" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="22" font-weight="bold">4. Create Embeddings</text>
<text x="500" y="663" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="15">Sentence Transformers • all-MiniLM-L6-v2</text>
<line x1="500" y1="695" x2="500" y2="735" stroke="#5fdcff" stroke-width="4"/><polygon points="493,730 507,730 500,740" fill="#5fdcff"/>
<rect x="200" y="735" width="600" height="110" rx="18" fill="#0c1b39" stroke="#24549a" stroke-width="2"/>
<text x="500" y="782" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="22" font-weight="bold">5. Semantic Retrieval</text>
<text x="500" y="813" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="15">Compare query and chunk embeddings • Top-K</text>
<line x1="500" y1="845" x2="500" y2="885" stroke="#5fdcff" stroke-width="4"/><polygon points="493,880 507,880 500,890" fill="#5fdcff"/>
<rect x="200" y="885" width="600" height="110" rx="18" fill="#0c1b39" stroke="#24549a" stroke-width="2"/>
<text x="500" y="932" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="22" font-weight="bold">6. Grounded Prompt</text>
<text x="500" y="963" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="15">User question + retrieved repository evidence</text>
<line x1="500" y1="995" x2="500" y2="1035" stroke="#5fdcff" stroke-width="4"/><polygon points="493,1030 507,1030 500,1040" fill="#5fdcff"/>
<rect x="200" y="1035" width="600" height="110" rx="18" fill="#0c1b39" stroke="#8b5cf6" stroke-width="2"/>
<text x="500" y="1082" text-anchor="middle" fill="#f5f8ff" font-family="Arial" font-size="22" font-weight="bold">7. Groq + Qwen → Answer</text>
<text x="500" y="1113" text-anchor="middle" fill="#8fa9cd" font-family="Arial" font-size="15">Grounded response + source evidence</text>
<text x="500" y="1200" text-anchor="middle" fill="#7189ad" font-family="Arial" font-size="15">Upload → Process → Embed → Retrieve → Ground → Generate → Verify</text></svg>